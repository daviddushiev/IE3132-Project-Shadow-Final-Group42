events {
    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name solace.test;

        root /usr/share/nginx/public;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 80;
        server_name archive.solace.test;

        root /usr/share/nginx/archive;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /documents/ {
            try_files $uri =404;
        }
    }

    # Unknown hostnames should not automatically reveal either site.
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }
}
