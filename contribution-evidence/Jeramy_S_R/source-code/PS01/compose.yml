services:
  ps01-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ps01-web
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped
    networks:
      - ps01-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  ps01-dns:
    build:
      context: ./dns
      dockerfile: Dockerfile
    container_name: ps01-dns
    ports:
      - "127.0.0.1:1053:53/udp"
      - "127.0.0.1:1053:53/tcp"
    restart: unless-stopped
    networks:
      - ps01-network
    security_opt:
      - no-new-privileges:true

networks:
  ps01-network:
    driver: bridge
